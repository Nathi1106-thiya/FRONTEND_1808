<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body>
<header>
  <nav class="navbar navbar-dark bg-white fixed-top shadow-sm py-2"> 
    <div  class="container">
        <!-- logo -->
      <a class="navbar-brand m-0" href="#">
  <img src="../../CSS/assets/image/logo.svg" alt="love logo" class="rounded "
        style="width: 90px;"></a>

<!-- right side -->
  <div class="d-flex align-items-center gap-3">
    <a href="#"  class="btn btn-warning fw-semibold px-3">Take a Tour</a>
    <span class="bg-info text-danger rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 42px; height: 42px;">SLA</span>
  </div>
  </div>
  </nav>
</header>
<main class="pt-4 mt-4">
    <section  class="container-fluid px-3 pb-3 my-4" >
    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="../assets/images/banner/1.avif" class="d-block w-100" alt="...">
        </div>

        <div class="carousel-item">
            <img src="../assets/images/banner/4.avif" class="d-block w-100" alt="...">
        </div>

        <div class="carousel-item">
            <img src="../assets/images/banner/3.avif" class="d-block w-100" alt="...">
        </div>

         <div class="carousel-item">
            <img src="../assets/images/banner/4.avif" class="d-block w-100" alt="...">
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleControls"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>

    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleControls"
            data-bs-slide="next">

        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>

    </button>

</div>
</section>

<section>
    
  <div class="container">
    <div class="row">


      <div  class="col-sm-3 col-md-4 col-xl-6 col-xxl-12"> 
        <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Email address</label>
  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>
<div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
</div>
      </div>
      <div class="w-50 p-3">
        <div class="mb-3" >
          <img src="../assets/images/banner/3.avif" class="w-100"  alt="">

        </div>

      </div>

    </div>
  </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
   
</body>
</html>
