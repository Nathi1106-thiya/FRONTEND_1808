
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMNS - Cart</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-pink-50 min-h-screen">

    <!-- HEADER -->
    <header class="bg-pink-600 text-white px-8 py-5 flex justify-between items-center shadow-md">

        <h1 class="text-3xl font-bold">
            DMNS CART
        </h1>

        <a href="../index.html"
           class="bg-white text-pink-600 px-5 py-2 rounded-full font-semibold
                  hover:bg-pink-100 hover:scale-105
                  transition-all duration-300">
            BACK
        </a>

    </header>


    <!-- MAIN -->
    <main class="max-w-6xl mx-auto px-6 py-10">

        <h2 class="text-2xl font-bold text-gray-800 mb-8 text-center">
            Your Cart Items
        </h2>


        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- CARD 1 -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden
                        hover:shadow-xl hover:-translate-y-1
                        transition-all duration-300">

                <div class="p-4">
                    <img src="../../assets/1.jpg"
                         alt="Women's Kurti"
                         class="w-full h-64 object-cover rounded-xl">
                </div>

                <div class="p-6 pt-2">

                    <h2 class="text-xl font-bold text-gray-800 mb-2">
                        Women's Kurti
                    </h2>

                    <p class="text-gray-500 mb-4">
                        Quantity: 1
                    </p>

                    <p class="text-xl font-bold text-pink-600 mb-5">
                        ₹499
                    </p>

                    <button class="w-full bg-pink-600 text-white py-2 rounded-full
                                   font-semibold
                                   hover:bg-pink-700 hover:scale-105
                                   transition-all duration-300">
                        Remove
                    </button>

                </div>

            </div>


            <!-- CARD 2 -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden
                        hover:shadow-xl hover:-translate-y-1
                        transition-all duration-300">

                <div class="p-4">
                    <img src="../../assets/2.webp"
                         alt="Women's Kurti"
                         class="w-full h-64 object-cover rounded-xl">
                </div>

                <div class="p-6 pt-2">

                    <h2 class="text-xl font-bold text-gray-800 mb-2">
                        Women's Kurti
                    </h2>

                    <p class="text-gray-500 mb-4">
                        Quantity: 1
                    </p>

                    <p class="text-xl font-bold text-pink-600 mb-5">
                        ₹599
                    </p>

                    <button class="w-full bg-pink-600 text-white py-2 rounded-full
                                   font-semibold
                                   hover:bg-pink-700 hover:scale-105
                                   transition-all duration-300">
                        Remove
                    </button>

                </div>

            </div>


            <!-- CARD 3 -->
            <div class="bg-white rounded-2xl shadow-md overflow-hidden
                        hover:shadow-xl hover:-translate-y-1
                        transition-all duration-300">

                <div class="p-4">
                    <img src="../../assets/3.webp"
                         alt="Women's Kurti"
                         class="w-full h-64 object-cover rounded-xl">
                </div>

                <div class="p-6 pt-2">

                    <h2 class="text-xl font-bold text-gray-800 mb-2">
                        Women's Kurti
                    </h2>

                    <p class="text-gray-500 mb-4">
                        Quantity: 1
                    </p>

                    <p class="text-xl font-bold text-pink-600 mb-5">
                        ₹699
                    </p>

                    <button class="w-full bg-pink-600 text-white py-2 rounded-full
                                   font-semibold
                                   hover:bg-pink-700 hover:scale-105
                                   transition-all duration-300">
                        Remove
                    </button>

                </div>

            </div>

        </div>


        <!-- TOTAL SECTION -->
        <div class="mt-10 bg-white rounded-2xl shadow-md p-6
                    flex flex-col md:flex-row justify-between items-center gap-4">

            <h2 class="text-2xl font-bold text-gray-800">
                Total: ₹1797
            </h2>

            <button class="bg-pink-600 text-white px-8 py-3 rounded-full
                           font-semibold shadow-md
                           hover:bg-pink-700 hover:scale-105
                           transition-all duration-300">
                Checkout
            </button>

        </div>

    </main>

</body>

</html>
