<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMNS - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-pink-50 min-h-screen">

    <div class="min-h-screen flex items-center justify-center px-4">

        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">

            <h1 class="text-3xl font-bold text-center text-pink-600 mb-2">
                DMNS
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Login to your account
            </p>

            <!-- Email -->
            <div class="mb-5">

                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           outline-none focus:ring-2 focus:ring-pink-400 required">

            </div>


            <!-- Password -->
            <div class="mb-6">

                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           outline-none focus:ring-2 focus:ring-pink-400 required">

            </div>


            <!-- Login Button -->
            <button
                class="w-full bg-pink-600 text-white py-3 rounded-full
                       font-semibold shadow-md
                       hover:bg-pink-700 hover:scale-105
                       transition-all duration-300">

                Login

            </button>


            <!-- Back -->
            <div class="text-center mt-6">

                <a href="../index.html"
                   class="text-pink-600 font-semibold hover:underline">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

</body>

</html>
