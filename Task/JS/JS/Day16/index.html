<html lang="en">

<body>

     <form id="empform" style="padding: 20px; display: flex; gap: 30px;">
        <input type="text" id="txt" >
        <input type="email" id="mail">
        <input type="number" id="num">
        <button type="submit">Submit</button>
    </form>

    

<div style="display: flex; gap: 60px; padding: 5px; margin-top: 40px;">
    <table border="1" cellpadding="10" >
        <thead>
      <th>
        S.NO
      </th>
      <th>NAME</th>
      <th>EMAIL</th>
      <th>NUMBER</th>
    </thead>

    <tbody id="dataValue"> 
    </tbody>
    </table>



      <table border="1" cellpadding="10" >
          <thead>
        <th>
          S.NO
        </th>
        <th>NAME</th>
        <th>EMAIL</th>
        <th>AGE</th>
      </thead>

      <tbody id="dataValue1"> 
      </tbody>
      </table>
    <button type="submit" id="agebtn" style="padding: 5px; height: 25px ;">Click</button>
</div>

<script>

let form = document.getElementById("empform");


// new line

const getData = () => {
    let employee = JSON.parse(localStorage.getItem("employee")) || [];
    let table = document.getElementById("dataValue");
    let data = "";

    employee.forEach((e, i) => {
        data += `
            <tr>
                <td>${i + 1}</td>
                <td>${e.name}</td>
                <td>${e.email}</td>
                <td>${e.number}</td>
            </tr>
        `;
    });

    table.innerHTML = data;
};
  getData();

// document.addEventListener("DOMContentLoaded", () => {
// });


// old line

form.addEventListener("submit", (event) => {
    event.preventDefault();

    let empName = document.getElementById("txt");
    let empEmail = document.getElementById("mail");
    let empNumber = document.getElementById("num");


    const name = empName.value.trim();
    const email = empEmail.value.trim();
    const number = empNumber.value.trim();

    // Validation
    if (name === "" || email === "" || number === "") {
        alert("Please fill in all fields!");
        return;
    }

    // Get saved employees
    let employee = JSON.parse(localStorage.getItem("employee")) || [];

    // Create an employee object
    let obj = { name, email, number };

    // Add the new employee

    employee.push(obj);

    // Save to localStorage

    localStorage.setItem("employee", JSON.stringify(employee));

    // Clear input fields

    // empName.value = "";
    // empEmail.value = "";
    // empNumber.value = "";
    
    form.reset()

    // Display updated table

    
    getData();
});
</script>
