<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

     <form id="empform" style="padding: 20px; display: flex; gap: 30px;">
        <input type="text" id="txt" >
        <input type="number" id="age">
        <input type="text" id="department">
        <input type="number" id="sal">
        <button type="submit">Submit</button>
    </form>

    

<div style="display: flex; gap: 60px; padding: 5px; margin-top: 40px;">
    <table border="1" cellpadding="10" >
        <thead>
      <th>
        S.NO
      </th>
      <th>NAME</th>
      <th>AGE</th>
      <th>DEPARTMENT</th>
      <th>SALARY</th>
    </thead>

    <tbody id="dataValue"> 
    </tbody>
    </table>

</div>

</body>
</html>

<script>

let form = document.getElementById("empform");


// new line

const getData = () => {
    let employee = JSON.parse(localStorage.getItem("employee")) || [];
    let table = document.getElementById("dataValue");
    let data = "";

    employee.forEach((e, i) => {
        data += `
            <tr>
                <td>${i + 1}</td>
                <td>${e.name}</td>
                <td>${e.age}</td>
                <td>${e.dep}</td>
                <td>${e.sala}</td>
            </tr>
        `;
    });

    table.innerHTML = data; 
};
  getData();

// document.addEventListener("DOMContentLoaded", () => {
// });


// old line

form.addEventListener("submit", (event) => {
    event.preventDefault();

    let empName = document.getElementById("txt");
    let empAge = document.getElementById("age");
    let empDep = document.getElementById("department");
    let empSal = document.getElementById("sal");


    const name = empName.value.trim();
    const age = empAge.value.trim()
    const dep = empDep.value.trim();
    const sala=empSal.value

    // Validation
    if (name === "" || age === "" || dep === "" || sala==="") {
        alert("Please fill in all fields!");
        return;
    }
    else if(Number(age)===0 || sala===0){
        alert("Number must be positive")
        return
    }

    // Get saved employees
    let employee = JSON.parse(localStorage.getItem("employee")) || [];

    // Create an employee object
    let obj = {id: Date.now(),name,age,dep,sala};

    // Add the new employee
    employee.push(obj);

    // Save to localStorage
    localStorage.setItem("employee", JSON.stringify(employee));

    console.log(employee);
    

    // Clear input fields

    // empName.value = "";
    // empEmail.value = "";
    // empNumber.value = "";
    
    form.reset()

    // Display updated table

    
    getData();
});

</script>
